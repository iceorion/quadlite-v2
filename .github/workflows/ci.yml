name: gates

# B0/B1/B2/B3/B4/B5/B6/B7/B8 闸门：需求追踪 + 静态边界 + 静态契约（Core / Fs / 外壳 / 列表 / 菜单 / 图标缩略图 / 自测出包 / 发布线）+
# 检查链自测 + 合规 + C# L0/B2/B3/B4/B5/B6/B7/B8 runner + Fs 适配器编译 +
# App 外壳、列表、菜单、图标缩略图、自测 / 出包与发布线状态内核编译。
# C# 源码以 C# 5 语法子集编译（/langversion:5、/codepage:65001），只引用系统程序集。
# Fs 层编译成 library 但不运行：真实 IFileOperation / 系统剪贴板 / watcher 行为未验证。
# B3/B4 的 App 状态内核只编译成 library（零 I/O、不引用呈现框架程序集）。
# R1 起新增 real-exe-build / real-exe-selftest 两步：build.ps1 把四层源码用
# 系统 C# 编译器一次编成单个 QuadLite.exe（WPF 消息循环、PerMonitorV2 manifest），
# 并在无交互桌面上实跑产品 exe 的 --selftest（≥100 行 / verdict GREEN / 退出码 0）。
# R2 起 Fs 层含 IFileOperation 托管 COM 声明与 transport（Windows SDK 逐字对应），
# CI 只编译、不实例化 COM、不调用 PerformOperations，运行期一律标「未验证」。
# R3 起 Host 窗口按 LayoutMath.Slots 四档落位、用 IDirSource 枚举目录、ListBox 呈现条目，
# 并把复制 / 移动 / 删除经 OperationCoordinator 接到 R2 的 ShellTransport（默认关闭）。
# R4 起 Fs 层新增 IContextMenu / IContextMenu2/3 / IShellFolder 托管 COM 声明与
# NativeMenuHost（标准四步 + owner 窗口消息转发），Host 右键把 MenuTarget 快照接入；
# 宿主默认关闭，产品程序集零 verb 查询 / 零删项。
# R5 起 Fs 层新增 IShellItemImageFactory 托管 COM 声明与 IconThumbHost
# （独立 STA / SIIGBF flags / 8 秒看门狗 / try-finally 释放 / 默认关闭），
# Host 列表项模板带图标位；图片解码走 WPF 内置 WIC 系统包装，不新增手写 COM 声明。
# CI 仍只编译单 exe 与跑无窗口 --selftest：不开窗口、不枚举目录、不实例化 COM。
# R4 菜单宿主、R5 图标 / 缩略图取图宿主都已接线但默认关闭；CI 不实例化 COM、
# 不解码、不写 thumbcache，菜单与图标呈现运行期一律标「未验证」；
# 拖放 / 七档视图与筛选仍未接入；
# MSBuild 出包路径与 H1–H6 真实取证、C4 带杀软 VM 均不在 CI 内，M1 / M2 / M3 仍不成立。
# 详见 docs/adr/ADR-v2-001.md、ADR-v2-002.md、ADR-v2-004.md、ADR-v2-005.md、
# ADR-v2-006.md、ADR-v2-007.md、ADR-v2-008.md、ADR-v2-009.md、ADR-v2-010.md、
# ADR-v2-011.md、ADR-v2-012.md、ADR-v2-013.md、ADR-v2-014.md、ADR-v2-015.md。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: check-trace
        run: python tools/check_trace.py
      - name: check-boundaries
        run: python tools/check_boundaries.py
      - name: check-core-specs
        run: python tools/check_core_specs.py
      - name: check-fs-specs
        run: python tools/check_fs_specs.py
      - name: check-shell-specs
        run: python tools/check_shell_specs.py
      - name: check-list-specs
        run: python tools/check_list_specs.py
      - name: check-menu-specs
        run: python tools/check_menu_specs.py
      - name: check-icon-specs
        run: python tools/check_icon_specs.py
      - name: check-selftest-specs
        run: python tools/check_selftest_specs.py
      - name: check-release-specs
        run: python tools/check_release_specs.py
      - name: check-realization-specs
        run: python tools/check_realization_specs.py
      - name: check-transport-specs
        run: python tools/check_transport_specs.py
      - name: check-ui-specs
        run: python tools/check_ui_specs.py
      - name: check-menu-host-specs
        run: python tools/check_menu_host_specs.py
      - name: check-icon-thumb-specs
        run: python tools/check_icon_thumb_specs.py
      - name: run-tests (includes negative controls)
        run: python tools/run_tests.py
      - name: open-source compliance
        run: python tools/check_open_source.py
      - name: csharp-runner (L0 + B2 + B3 + B4 + B5 + B6 + B7 + B8 unit tests, C# 5 / net48)
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { Write-Host 'C# compiler not found'; exit 1 }
          $core = @(Get-ChildItem -Path 'src/QuadLite.Core/*.cs' | ForEach-Object { $_.FullName })
          $app = @(Get-ChildItem -Path 'src/QuadLite.App/*.cs' | ForEach-Object { $_.FullName })
          $tests = @(Get-ChildItem -Path 'tests/QuadLite.Tests/*.cs' | ForEach-Object { $_.FullName })
          $out = Join-Path $env:RUNNER_TEMP 'QuadLite.Tests.exe'
          & $compiler /nologo /target:exe /langversion:5 /codepage:65001 /r:System.dll /r:System.Core.dll /out:$out $core $app $tests
          if ($LASTEXITCODE -ne 0) { Write-Host "C# compile failed ($LASTEXITCODE)"; exit $LASTEXITCODE }
          & $out
          if ($LASTEXITCODE -ne 0) { Write-Host "C# runner failed ($LASTEXITCODE)"; exit $LASTEXITCODE }
      - name: csharp-fs-compile (B2 adapters, library only)
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { Write-Host 'C# compiler not found'; exit 1 }
          $core = @(Get-ChildItem -Path 'src/QuadLite.Core/*.cs' | ForEach-Object { $_.FullName })
          $fs = @(Get-ChildItem -Path 'src/QuadLite.Fs/*.cs' | ForEach-Object { $_.FullName })
          $out = Join-Path $env:RUNNER_TEMP 'QuadLite.Fs.dll'
          & $compiler /nologo /target:library /langversion:5 /codepage:65001 /r:System.dll /r:System.Core.dll /out:$out $core $fs
          if ($LASTEXITCODE -ne 0) { Write-Host "Fs library compile failed ($LASTEXITCODE)"; exit $LASTEXITCODE }
          Write-Host 'Fs adapters compile; runtime behaviour is NOT exercised here.'
      - name: csharp-app-compile (B3 shell + B4 list + B5 menu + B6 thumb + B7 selftest + B8 release state, library only)
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { Write-Host 'C# compiler not found'; exit 1 }
          $core = @(Get-ChildItem -Path 'src/QuadLite.Core/*.cs' | ForEach-Object { $_.FullName })
          $app = @(Get-ChildItem -Path 'src/QuadLite.App/*.cs' | ForEach-Object { $_.FullName })
          if ($app.Count -lt 10) { Write-Host 'App state kernel missing (expect 10 .cs)'; exit 1 }
          $out = Join-Path $env:RUNNER_TEMP 'QuadLite.App.dll'
          & $compiler /nologo /target:library /langversion:5 /codepage:65001 /r:System.dll /r:System.Core.dll /out:$out $core $app
          if ($LASTEXITCODE -ne 0) { Write-Host "App library compile failed ($LASTEXITCODE)"; exit $LASTEXITCODE }
          Write-Host 'App state kernel compiles as a library here; the real WPF window and list controls are built and self-tested by real-exe-build / real-exe-selftest instead.'
      - name: real-exe-build (R1 single-file WPF host, C# 5 / net48 / zero NuGet)
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'quadlite-dist'
          $buildOutput = & ./build.ps1 -Configuration Release -OutDir $dist 2>&1
          $buildCode = $LASTEXITCODE
          $buildOutput | ForEach-Object { Write-Host $_ }
          if ($buildCode -ne 0) {
            $buildOutput | Where-Object { $_ -match 'error CS|BUILD:' } | ForEach-Object { Write-Host "::error::$_" }
            Write-Host "real exe build failed ($buildCode)"; exit $buildCode
          }
          $exe = Join-Path $dist 'QuadLite.exe'
          $manifest = Join-Path $dist 'BUILD.txt'
          if (-not (Test-Path -LiteralPath $exe)) { Write-Host 'QuadLite.exe missing'; exit 1 }
          if (-not (Test-Path -LiteralPath $manifest)) { Write-Host 'BUILD.txt missing'; exit 1 }
          $text = Get-Content -LiteralPath $manifest -Raw
          foreach ($field in @('compile-time', 'commit', 'worktree', 'exe-size',
                               'sha256', 'embedded-resources', 'package-selfcheck')) {
            if ($text -notmatch [regex]::Escape($field)) { Write-Host "BUILD.txt missing $field"; exit 1 }
          }
          Write-Host 'real exe built; BUILD.txt has all 7 fields'
      - name: real-exe-selftest (R1 product exe, >=100 lines, verdict GREEN, exit 0)
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'quadlite-dist'
          $exe = Join-Path $dist 'QuadLite.exe'
          $out = Join-Path $env:RUNNER_TEMP 'quadlite-selftest.txt'
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru -RedirectStandardOutput $out
          if ($null -eq $p -or -not (Test-Path -LiteralPath $out)) { Write-Host 'selftest did not run'; exit 1 }
          $lines = @(Get-Content -LiteralPath $out -Encoding UTF8)
          if ($lines.Count -lt 100) { Write-Host "selftest only $($lines.Count) lines"; Get-Content -LiteralPath $out; exit 1 }
          if ($lines[-1] -ne 'verdict: GREEN') { Write-Host "selftest last line: $($lines[-1])"; Get-Content -LiteralPath $out; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Host "selftest exit $($p.ExitCode)"; exit 1 }
          Write-Host "product --selftest: $($lines.Count) lines, verdict GREEN, exit 0"
