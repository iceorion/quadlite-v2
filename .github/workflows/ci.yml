name: gates

# B0/B1 闸门：需求追踪 + 静态边界 + 静态契约 + 检查链自测 + 合规 + C# L0 runner。
# C# 源码以 C# 5 语法子集编译（/langversion:5、/codepage:65001），只引用系统程序集。
# MSBuild 的 WPF 应用构建与 build.ps1 -SingleFile 仍未接入；exe 形态 --selftest 随 B7 接入。
# 详见 docs/adr/ADR-v2-001.md 与 docs/adr/ADR-v2-002.md。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: check-trace
        run: python tools/check_trace.py
      - name: check-boundaries
        run: python tools/check_boundaries.py
      - name: check-core-specs
        run: python tools/check_core_specs.py
      - name: run-tests (includes negative controls)
        run: python tools/run_tests.py
      - name: open-source compliance
        run: python tools/check_open_source.py
      - name: csharp-runner (L0 unit tests, C# 5 / net48)
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { Write-Host 'C# compiler not found'; exit 1 }
          $core = @(Get-ChildItem -Path 'src/QuadLite.Core/*.cs' | ForEach-Object { $_.FullName })
          $tests = @(Get-ChildItem -Path 'tests/QuadLite.Tests/*.cs' | ForEach-Object { $_.FullName })
          $out = Join-Path $env:RUNNER_TEMP 'QuadLite.Tests.exe'
          & $compiler /nologo /target:exe /langversion:5 /codepage:65001 /r:System.dll /r:System.Core.dll /out:$out $core $tests
          if ($LASTEXITCODE -ne 0) { Write-Host "C# compile failed ($LASTEXITCODE)"; exit $LASTEXITCODE }
          & $out
          if ($LASTEXITCODE -ne 0) { Write-Host "C# runner failed ($LASTEXITCODE)"; exit $LASTEXITCODE }
